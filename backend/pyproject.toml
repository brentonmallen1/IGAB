[project]
name = "igab"
version = "0.1.0"
description = "IGAB - I've Got A Budget: Self-hosted envelope budgeting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.7",
    "fastapi[standard]>=0.136.0",
    "httpx>=0.28.1",
    "bcrypt>=4.0.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.26",
    "sqlalchemy[asyncio]>=2.0.49",
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "polars>=1.30.0",
    "rapidfuzz>=3.14.5",
    "pillow>=11.0.0",
    "pillow-heif>=0.16.0",
    # PDF rendering for receipt attachments (thumbnails + AI rasterization).
    # AGPL-3.0 — deliberate choice: copyleft is acceptable for this project.
    "pymupdf>=1.24.0",
]

[dependency-groups]
dev = [
    # Pinned, not floated. ty is 0.0.x: its diagnostics change release to
    # release, so `>=0.0.0a1` meant an alpha type checker could fail CI on
    # Astral's schedule rather than ours — which is exactly what happened
    # when 0.0.72 surfaced 12 new diagnostics on unchanged source. Upgrade
    # deliberately, absorbing the new diagnostics as their own piece of work.
    "ty==0.0.72",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.0.0",
    "respx>=0.22.0",
    "ruff>=0.15.11",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igab"]
