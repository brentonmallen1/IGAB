<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; color: #333; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h2>SimpleFIN Sync Complete</h2>
  <p>Budget: <strong>{{ budget_name }}</strong></p>
  <table style="border-collapse: collapse; width: 100%;">
    <tr>
      <td style="padding: 8px 0; border-bottom: 1px solid #eee;">Transactions imported</td>
      <td style="padding: 8px 0; border-bottom: 1px solid #eee; text-align: right; color: #59a14f;">
        {{ imported }}
      </td>
    </tr>
    <tr>
      <td style="padding: 8px 0;">Transactions skipped (duplicates)</td>
      <td style="padding: 8px 0; text-align: right; color: #888;">{{ skipped }}</td>
    </tr>
  </table>
  <p style="color: #888; font-size: 12px; margin-top: 24px;">Sent by IGAB</p>
</body>
</html>
