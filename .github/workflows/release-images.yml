# Build and publish multi-arch (amd64/arm64) images to GHCR on version tags.
#
# Publishes:
#   ghcr.io/<owner>/igab-api     — FastAPI backend (runs migrations on start)
#   ghcr.io/<owner>/igab-web     — nginx serving the built frontend + /api proxy
#   ghcr.io/<owner>/igab-backup  — pg_dump/attachments backup agent (+ age)
#   ghcr.io/<owner>/igab-aio     — All-in-One: Postgres + API + nginx + backups
#
# Cut a release with `just release 2026.08.4` (creates the GitHub release,
# which creates the tag). A bare `git tag … && git push origin …` also works —
# the release job below backfills the GitHub release the tag path skips.
# Each image gets :2026.08.4, :2026.08, and :latest tags.
#
# Each platform builds natively (amd64 on ubuntu-latest, arm64 on
# ubuntu-24.04-arm — no QEMU emulation) and pushes by digest; the merge
# job then assembles the multi-arch manifest and applies the tags.

name: Release images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Tags pushed directly (skipping `just release`) built images but never got
  # a GitHub release — the releases page silently stopped at the last manual
  # one. Create the release here whenever the tag doesn't have one yet.
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Ensure a GitHub release exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --verify-tag --generate-notes --latest

  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [igab-api, igab-web, igab-backup, igab-aio]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: igab-api
            context: backend
            dockerfile: backend/Dockerfile
            target: ""
          - image: igab-web
            context: frontend
            dockerfile: frontend/Dockerfile
            target: production
          - image: igab-backup
            context: scripts
            dockerfile: scripts/Dockerfile
            target: ""
          - image: igab-aio
            context: .
            dockerfile: Dockerfile.aio
            target: ""
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        image: [igab-api, igab-web, igab-backup, igab-aio]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # CalVer tags (v2026.08.4) are not valid semver, so match by regex:
          # full version (2026.08.4) and year.month (2026.08)
          tags: |
            type=match,pattern=v(.+),group=1
            type=match,pattern=v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)
