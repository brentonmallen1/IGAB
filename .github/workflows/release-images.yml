# Build and publish multi-arch (amd64/arm64) images to GHCR on version tags.
#
# Publishes:
#   ghcr.io/<owner>/igab-api     — FastAPI backend (runs migrations on start)
#   ghcr.io/<owner>/igab-web     — nginx serving the built frontend + /api proxy
#   ghcr.io/<owner>/igab-backup  — pg_dump/attachments backup agent (+ age)
#   ghcr.io/<owner>/igab-aio     — All-in-One: Postgres + API + nginx + backups
#
# Tag a release with `git tag v1.2.3 && git push origin v1.2.3`.
# Each image gets :1.2.3, :1.2, and :latest tags.

name: Release images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: igab-api
            context: backend
            dockerfile: backend/Dockerfile
            target: ""
          - image: igab-web
            context: frontend
            dockerfile: frontend/Dockerfile
            target: production
          - image: igab-backup
            context: scripts
            dockerfile: scripts/Dockerfile
            target: ""
          - image: igab-aio
            context: .
            dockerfile: Dockerfile.aio
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
