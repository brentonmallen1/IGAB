services:
  db:
    image: postgres:16-alpine
    container_name: igab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-igab}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-igab}
    volumes:
      - ${DB_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-igab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: igab-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-igab}:${DB_PASSWORD}@db:${DB_PORT:-5432}/${DB_NAME:-igab}
      UVICORN_RELOAD: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${ATTACHMENTS_DIR:-./data/attachments}:/data/attachments
      # Shared with db-backup: the API lists backups and talks to the agent
      # via files in /backups/.agent (see services/backup_service.py)
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: sync
          path: ./backend/tests
          target: /app/tests

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: igab-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    profiles:
      - dev
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src

  # Production entry point: serves the built frontend (baked into the image)
  # and proxies /api to the backend. TLS terminates outside compose
  # (Tailscale Serve or a reverse proxy) — see README "Install on your phone".
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: igab-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    profiles:
      - production

  # Periodic pg_dump + attachments archive into ./backups with retention
  # pruning and optional age encryption — see scripts/db-backup.sh.
  # Financial data with no backup story is a demo, not a system of record.
  db-backup:
    image: postgres:16-alpine
    container_name: igab-db-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-igab}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-igab}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ${ATTACHMENTS_DIR:-./data/attachments}:/attachments:ro
      - ./scripts/db-backup.sh:/db-backup.sh:ro
    entrypoint: ["sh", "/db-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - production

