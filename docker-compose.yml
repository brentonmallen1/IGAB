services:
  db:
    image: postgres:16-alpine
    container_name: igab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-igab}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-igab}
    volumes:
      - ${DB_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-igab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: igab-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-igab}:${DB_PASSWORD}@db:${DB_PORT:-5432}/${DB_NAME:-igab}
      UVICORN_RELOAD: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${ATTACHMENTS_DIR:-./data/attachments}:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: sync
          path: ./backend/tests
          target: /app/tests

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: igab-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    profiles:
      - dev
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src

  # Production entry point: serves the built frontend (baked into the image)
  # and proxies /api to the backend. TLS terminates outside compose
  # (Tailscale Serve or a reverse proxy) — see README "Install on your phone".
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: igab-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    profiles:
      - production

  # Daily pg_dump into ./backups, pruning dumps older than BACKUP_KEEP_DAYS.
  # Financial data with no backup story is a demo, not a system of record.
  db-backup:
    image: postgres:16-alpine
    container_name: igab-db-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-igab}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-igab}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    # List form on purpose: compose word-splits a string entrypoint, which
    # mangles the inline shell loop into "syntax error: unexpected &&"
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -Fc -f "/backups/igab-$$(date +%Y%m%d-%H%M%S).dump" \
            && echo "backup written" \
            && find /backups -name "igab-*.dump" -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - production

